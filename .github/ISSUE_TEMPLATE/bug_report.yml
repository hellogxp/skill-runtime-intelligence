name: Bug report
description: Report reproducible incorrect behavior or a misleading evidence claim
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Skill Runtime Intelligence. Do not attach raw
        runtime databases, transcripts, prompts, credentials, or private paths.
  - type: input
    id: version
    attributes:
      label: Skill Runtime version
      description: Run `skill-runtime --version`.
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Codex, Claude Code, Qoder, OpenCode, Observability import, Other]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include sanitized commands and steps only.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Share relevant `skill-runtime doctor` output after removing private data.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, prompts, private source code, and personal paths.
          required: true
